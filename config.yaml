# Sentinel Live Server configuration
# Edit this file, then (re)start the server. Never commit real API keys to git.

server:
  host: "127.0.0.1"     # bind locally; Cloudflare Tunnel exposes it publicly
  port: 8443

feeds:
  threat_refresh_minutes: 5
  geo_refresh_minutes: 15
  news_refresh_minutes: 30
  request_timeout_seconds: 20

# Optional: free abuse.ch Auth-Key (https://auth.abuse.ch/) enriches the
# threat map with ThreatFox malware-family data. Without it, the map still
# works fully on the keyless SANS DShield feed.
threat_feeds:
  abuse_ch_auth_key: ""

# Flight lookup (AviationStack). The owner pastes a key here when ready.
# Free signup: https://aviationstack.com/  (free tier = 100 req/month)
flight_api:
  provider: "aviationstack"
  api_key: ""           # <-- PASTE KEY HERE, e.g. "abc123..."

# Cloudflare Tunnel (optional). If enabled, install.ps1 creates a second
# scheduled task that keeps the tunnel running alongside the server.
tunnel:
  enabled: false
  cloudflared_path: "C:\\Program Files\\cloudflared\\cloudflared.exe"
  # Quick tunnel (no account needed, random URL):
  args: "tunnel --url http://127.0.0.1:8443"
  # Named tunnel example (needs cloudflared login + DNS route):
  # args: "tunnel --hostname live.example.com --url http://127.0.0.1:8443"

# Cloudflare Turnstile bot check for the public forms (optional).
# Default OFF: while disabled — or enabled with no secret key set —
# the contact, ticket, and newsletter forms behave exactly as they
# do without it. To turn it on: create a Turnstile widget for this
# site at https://challenges.cloudflare.com/, put the SITE key in the
# web pages (it is public), paste the SECRET key here (it never goes
# in a page or anywhere public), and set enabled: true. While on, a
# submission whose bot-check token is missing or invalid is rejected
# before anything is stored, and if Cloudflare's verification
# service is unreachable the submission fails closed — the visitor
# is told to email or call instead; nothing silently passes.
turnstile:
  enabled: false
  secret_key: ""

# Shared secret for POST /api/briefing. Leave empty to allow local posts
# without a token (the port is localhost-only by default).
briefing_token: ""

# Admin API/page access. Allowed from localhost (127.0.0.1) ONLY while
# the tunnel is disabled — with the tunnel on, every request looks local,
# so the bypass is off and the key is required even on the machine itself.
# Set a key to allow admin access via the X-Admin-Key header.
admin_key: ""

# Cross-origin access for the API/pages. Default: none — pages served by
# this server are same-origin and need no CORS. ONLY if your public site
# is hosted on a different origin and fetches these endpoints, list that
# exact origin here (e.g. ["https://sentinelsafeguard.net"]). Never use
# "*": with the localhost admin bypass it lets any website the owner
# visits read admin data out of the local server.
cors_origins: []

# HackProof payments pass-through (optional). Default OFF: while disabled,
# nothing changes and the payments routes do not exist on this server.
# When enabled, Sentinel Live forwards the three public HackProof payments
# routes (POST /api/orders, GET /api/orders/<id>, POST /api/certificates)
# to the payments service running on THIS machine, so only one server
# faces the world and the payments service keeps its loopback-only bind.
# The payments admin/review endpoints are never forwarded — they stay
# reachable only directly on the machine itself. If your buy page is
# hosted on a different origin, also add that exact origin to
# cors_origins above (never "*").
hackproof_payments:
  enabled: false
  upstream: "http://127.0.0.1:8787"

# RSS sources. Add/remove freely; failures are tolerated per-feed.
