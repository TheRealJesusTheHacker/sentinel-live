name: Build Windows EXE

# Builds SentinelLive.exe automatically whenever a GitHub release is published.
# The .exe is attached to the release — the owner downloads it, nothing else.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build single-file exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name SentinelLive `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --hidden-import aiosqlite `
            app.py

      - name: Generate checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/SentinelLive.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SentinelLive.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Attach exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (!(Test-Path "dist/SentinelLive.exe")) { Write-Error "exe not found"; exit 1 }
          gh release upload "${{ github.ref_name }}" dist/SentinelLive.exe dist/SHA256SUMS.txt --clobber
