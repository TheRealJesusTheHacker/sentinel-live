{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<section class="pagehead">
  <h1>Admin <span class="grn">Console</span></h1>
  <p class="sub">Stored website submissions. This page is only reachable from the server itself (or with the admin key).</p>
</section>
<section>
  <label>Dataset
    <select id="ds">
      <option value="tickets">Get Help tickets</option>
      <option value="contacts">Contact form</option>
      <option value="newsletter">Newsletter signups</option>
    </select>
  </label>
  <button id="load">Load</button>
  <a id="csv" href="#">Export CSV</a>
  <p id="total" class="dim"></p>
  <div id="rows" class="tablewrap"><p class="dim">Pick a dataset and load.</p></div>
</section>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const t = document.getElementById('ds').value;
  const r = await fetch('/api/admin/submissions?type=' + t + '&limit=200');
  if (!r.ok) { document.getElementById('rows').innerHTML = '<p class="warn">Access denied.</p>'; return; }
  const d = await r.json();
  document.getElementById('total').textContent = d.total + ' records';
  document.getElementById('csv').href = '/api/admin/export?type=' + t + '&format=csv';
  if (!d.rows.length) { document.getElementById('rows').innerHTML = '<p class="dim">No records yet.</p>'; return; }
  const cols = Object.keys(d.rows[0]);
  let h = '<table><tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr>';
  d.rows.forEach(row => { h += '<tr>' + cols.map(c => '<td>' + esc(row[c]) + '</td>').join('') + '</tr>'; });
  document.getElementById('rows').innerHTML = h + '</table>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('load').onclick = load;
</script>
{% endblock %}
