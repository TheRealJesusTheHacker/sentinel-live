{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<section class="pagehead">
  <h1>Admin <span class="grn">Console</span></h1>
  <p class="sub">Stored website submissions. This page is only reachable from the server itself (or with the admin key).</p>
</section>
<section>
  <label>Dataset
    <select id="ds">
      <option value="tickets">Get Help tickets</option>
      <option value="contacts">Contact form</option>
      <option value="newsletter">Newsletter signups</option>
    </select>
  </label>
  <button id="load">Load</button>
  <a id="csv" href="#">Export CSV</a>
  <p id="total" class="dim"></p>
  <div id="rows" class="tablewrap"><p class="dim">Pick a dataset and load.</p></div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin.js"></script>
{% endblock %}
