<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sentinel Safeguard{% endblock %} — Sentinel Safeguard LLC</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/index.html">
    <img class="brand-logo" src="/assets/sentinel-safeguard-logo.jpg" alt="" width="33" height="40">
    <span class="brand-name">Sentinel <em>Safeguard</em></span>
  </a>
  <nav class="mainnav" aria-label="Main">
    <a href="/index.html"{% if request.url.path in ['/', '/index.html'] %} class="active" aria-current="page"{% endif %}>Home</a>
    <a href="/threat-map"{% if request.url.path == '/threat-map' %} class="active" aria-current="page"{% endif %}>Threat Map</a>
    <a href="/geopolitical"{% if request.url.path == '/geopolitical' %} class="active" aria-current="page"{% endif %}>Geopolitical</a>
    <a href="/flights"{% if request.url.path == '/flights' %} class="active" aria-current="page"{% endif %}>Flights</a>
    <a href="/report-issue"{% if request.url.path.startswith('/report-issue') %} class="active" aria-current="page"{% endif %}>Report an Issue</a>
    <a class="nav-cta" href="/index.html#contact">Contact</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <span>Sentinel Safeguard LLC &middot; Kansas City, MO</span>
  <span class="dim">Data refreshes automatically &middot; sources: SANS DShield, public RSS</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
